[package]
name = "taskboard"
version = "0.2.1"
rust-version = "1.99"
edition = "2024"
authors = ["Ilia Ilmer <contact@iliailmer.com>"]
description = "A fast, reliable CLI/TUI task board with atomic operations and file locking"
readme = "README.md"
homepage = "https://github.com/iliailmer/taskboard"
repository = "https://github.com/iliailmer/taskboard"
license = "MIT"
keywords = ["cli", "todo", "task", "productivity", "kanban"]
categories = ["command-line-utilities"]
exclude = [".github/", "tests/"]

[[bin]]
name = "tsk"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29"
home = "0.5.12"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.22.0"
terminal_size = "0.4"
tempfile = "3.27"

[dev-dependencies]
tempfile = "3.27"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
